<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Benign External Resource Test</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f5f2;
      color: #1f2933;
    }
    main {
      width: min(760px, calc(100% - 32px));
      padding: 32px;
      border: 1px solid #d4d7dd;
      border-radius: 8px;
      background: #ffffff;
    }
    code {
      overflow-wrap: anywhere;
    }
    a {
      color: #0b5cad;
    }
  </style>
</head>
<body>
  <main>
    <h1>Benign Static Capability Test</h1>
    <p id="external-resource-status">External resource loading test not executed: no author-controlled external host configured.</p>
    <p>This page loads an external script only when the checker supplies an author-owned script URL.</p>
    <p><a href="index.html">Back to index</a></p>
  </main>
  <script>
    (function () {
      var status = document.getElementById("external-resource-status");
      var params = new URLSearchParams(window.location.search);
      var scriptUrl = params.get("external_author_owned_script");

      if (!scriptUrl || !status) {
        return;
      }

      var parsedUrl;
      try {
        parsedUrl = new URL(scriptUrl, window.location.href);
      } catch (error) {
        status.textContent = "External resource loading test not executed: invalid external script URL.";
        return;
      }

      if (parsedUrl.protocol !== "https:") {
        status.textContent = "External resource loading test not executed: external script URL must use HTTPS.";
        return;
      }

      status.textContent = "External resource loading pending.";
      var script = document.createElement("script");
      script.src = parsedUrl.href;
      script.async = true;
      script.dataset.authorOwnedSandbox = "true";
      script.onload = function () {
        if (status.textContent === "External resource loading pending.") {
          status.textContent = "Benign external resource loaded but did not update expected text.";
        }
      };
      script.onerror = function () {
        status.textContent = "External resource loading test not executed: external script failed to load.";
      };
      document.head.appendChild(script);
    }());
  </script>
</body>
</html>
