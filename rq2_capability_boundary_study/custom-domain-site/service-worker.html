<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RQ2 Service Worker Capability Probe</title>
</head>
<body>
  <h1>RQ2 controlled author-owned sandbox</h1>
  <p>RQ2 controlled author-owned sandbox. No phishing, malware, credential collection, exploit delivery, or real command execution.</p>
  <p id="sw-status">Waiting for service worker.</p>
  <script>
    async function runCheck() {
      if (!("serviceWorker" in navigator)) {
        document.getElementById("sw-status").textContent = "Service worker API unavailable.";
        return;
      }
      navigator.serviceWorker.addEventListener("message", (event) => {
        document.getElementById("sw-status").textContent = event.data;
      });
      const registration = await navigator.serviceWorker.register("./service-worker.js", { scope: "./" });
      await navigator.serviceWorker.ready;
      const activeWorker = registration.active || navigator.serviceWorker.controller;
      if (activeWorker) {
        activeWorker.postMessage("rq2-benign-service-worker-check");
      } else {
        document.getElementById("sw-status").textContent = "Service worker registered but not active yet.";
      }
    }
    runCheck().catch((error) => {
      document.getElementById("sw-status").textContent = "Service worker check failed: " + error.name;
    });
  </script>
</body>
</html>
